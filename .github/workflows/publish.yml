name: publish

# Runs only when a semver tag is pushed. Does NOT publish until CARGO_REGISTRY_TOKEN
# is configured in repository secrets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check publish token
        id: token
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo publish
        if: steps.token.outputs.configured == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
